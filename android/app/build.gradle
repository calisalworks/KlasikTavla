apply plugin: 'com.android.application'

def testAdMobAppId = "ca-app-pub-3940256099942544~3347511713"
def testRewardedAdUnitId = "ca-app-pub-3940256099942544/5224354917"
def admobMode = System.getenv("ADMOB_AD_MODE") ?: "disabled"
def admobAppId = System.getenv("ADMOB_ANDROID_APP_ID") ?: (admobMode == "test" ? testAdMobAppId : "")

android {
    namespace = "com.klasiktavla.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.calisalworks.tersimpistir"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [admobApplicationId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A release bundle must be explicitly built in test mode or with real production IDs.
tasks.register("verifyAdMobReleaseConfig") {
    doLast {
        if (admobMode == "test") {
            if (admobAppId != testAdMobAppId ||
                (System.getenv("VITE_ADMOB_REWARDED_AD_UNIT_ID") ?: testRewardedAdUnitId) != testRewardedAdUnitId) {
                throw new GradleException("Test mode must use Google's official sample AdMob IDs.")
            }
            return
        }

        def rewardedUnitId = System.getenv("VITE_ADMOB_REWARDED_AD_UNIT_ID") ?: ""
        def appId = System.getenv("ADMOB_ANDROID_APP_ID") ?: ""
        def validAppId = appId.startsWith("ca-app-pub-") && appId.contains("~") && !appId.contains("/")
        def validRewardedUnit = rewardedUnitId.startsWith("ca-app-pub-") && rewardedUnitId.contains("/") && !rewardedUnitId.contains("~")
        if (admobMode != "production" || !validAppId || !validRewardedUnit ||
            appId == testAdMobAppId || rewardedUnitId == testRewardedAdUnitId) {
            throw new GradleException("Release AAB requires ADMOB_AD_MODE=production and real ADMOB_ANDROID_APP_ID / VITE_ADMOB_REWARDED_AD_UNIT_ID values. Use ADMOB_AD_MODE=test only for validation builds.")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn tasks.named("verifyAdMobReleaseConfig")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
