
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create Android project
        run: bunx cap add android

      - name: Configure Firebase Android app
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing. Add the Base64-encoded google-services.json from Firebase Console."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("android/build.gradle")
          app_gradle = Path("android/app/build.gradle")

          root = root_gradle.read_text(encoding="utf-8")
          plugin_line = "classpath 'com.google.gms:google-services:4.4.2'"
          if plugin_line not in root:
              marker = "dependencies {"
              if marker not in root:
                  raise RuntimeError("android/build.gradle içinde buildscript dependencies bulunamadı")
              root = root.replace(marker, marker + "\n        " + plugin_line, 1)
              root_gradle.write_text(root, encoding="utf-8")

          app = app_gradle.read_text(encoding="utf-8")
          apply_line = "apply plugin: 'com.google.gms.google-services'"
          if apply_line not in app and "id 'com.google.gms.google-services'" not in app:
              app += "\n" + apply_line + "\n"
              app_gradle.write_text(app, encoding="utf-8")

          variables = Path("android/variables.gradle")
          if variables.exists():
              content = variables.read_text(encoding="utf-8")
              additions = []
              if "rgcfaIncludeGoogle" not in content:
                  additions.append("        rgcfaIncludeGoogle = true")
              if "androidxCredentialsVersion" not in content:
                  additions.append("        androidxCredentialsVersion = '1.3.0'")
              if additions:
                  content = content.replace("ext {", "ext {\n" + "\n".join(additions), 1)
                  variables.write_text(content, encoding="utf-8")
          print("Firebase Android yapılandırması eklendi.")
          PY

      - name: Configure landscape and fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          pattern = r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>'
          match = re.search(pattern, content)

          if not match:
              raise RuntimeError("MainActivity AndroidManifest.xml icinde bulunamadi")

          activity_tag = match.group(0)

          if "android:screenOrientation=" not in activity_tag:
              new_tag = activity_tag[:-1] + ' android:screenOrientation="landscape">'
              content = content[:match.start()] + new_tag + content[match.end():]
              manifest.write_text(content, encoding="utf-8")

          java_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))

          if not java_files:
              raise RuntimeError("MainActivity.java bulunamadi")

          activity = java_files[0]
          source = activity.read_text(encoding="utf-8")
          marker = "public class MainActivity extends BridgeActivity {"

          if marker not in source:
              raise RuntimeError("MainActivity Java sinifi beklenen yapida degil")

          if "private void hideSystemUI()" not in source:
              addition = """
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }
              """
              source = source.replace(marker, marker + addition, 1)
              activity.write_text(source, encoding="utf-8")

          print("Yatay ekran ve tam ekran ayarlari eklendi.")
          PY

      - name: Configure Android App Links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          pattern = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)'
          match = re.search(pattern, content)
          if not match:
              raise RuntimeError("MainActivity AndroidManifest.xml icinde bulunamadi")

          activity_start = match.end()
          activity_end = content.find("</activity>", activity_start)
          if activity_end < 0:
              raise RuntimeError("MainActivity kapanis etiketi bulunamadi")

          block = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" android:host="klasiktavla.onrender.com" />
                  </intent-filter>
          """
          activity_content = content[activity_start:activity_end]
          if "klasiktavla.onrender.com" not in activity_content:
              content = content[:activity_end] + block + content[activity_end:]
              manifest.write_text(content, encoding="utf-8")
          print("KlasikTavla Android App Links ayari eklendi.")
          PY

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Prepare persistent debug keystore
        id: signing
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"

          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Kalici debug anahtari yuklendi."
          else
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            mkdir -p .signing-bootstrap
            cp "$KEYSTORE" .signing-bootstrap/debug.keystore
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "Ilk anahtar olusturuldu; Actions artifact olarak alin."
          fi

      - name: Upload initial signing key
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KlasikTavla-debug-keystore
          path: .signing-bootstrap/debug.keystore
          retention-days: 1
          if-no-files-found: error

      - name: Get Android SHA Fingerprints
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KlasikTavla-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
