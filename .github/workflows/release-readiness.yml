name: Release readiness checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/play-readiness-security]

permissions:
  contents: read

jobs:
  web-checks:
    name: TypeScript, build and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Build web app
        run: bun run build
      - name: Start test server
        env:
          NODE_ENV: test
          PORT: 3000
        run: |
          bun run dev > /tmp/klasik-tavla-test-server.log 2>&1 &
          echo $! > /tmp/klasik-tavla-test-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/api/health > /dev/null; then
              echo "Test server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Test server did not become healthy."
          cat /tmp/klasik-tavla-test-server.log
          exit 1
      - name: Run online game integration tests
        run: bun run test
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/klasik-tavla-test-server.log || true

  android-build:
    name: Android debug APK and release AAB compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build web app
        run: bun run build
      - name: Sync Capacitor Android project
        run: bunx cap sync android
      - name: Build debug APK and release AAB
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Upload Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
